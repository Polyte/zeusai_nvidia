[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeusai"
version = "2.0.0"
description = "zeusai - CLI coding agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "textual>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zeusai = "zeusai.cli:main"

[tool.setuptools.packages.find]
include = ["zeusai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
